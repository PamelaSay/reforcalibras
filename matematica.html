<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Conteúdos de Matemática em Libras do Reforça Libras.">
  <title>Matemática | Reforça Libras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="matematica.css">
</head>
<body>
  <header class="menu topo">
      <button type="button" class="btn-voltar" onclick="window.history.back()" aria-label="Voltar" title="Voltar" >
          <img src="botao_retornar.png" alt="Voltar" class="btn-voltar-img"  >
     </button>

     <div class="cabecalho-interno">
          <div class="logo-area">
             <img src="logo.png" alt="Logo Reforça Libras">
         </div>
         <h1>Matemática</h1>
     </div>
    </header>
  <main>
    <section class="ferramentas" aria-label="Ferramentas para encontrar conteúdos">
      <label class="campo-pesquisa" for="pesquisa-conteudo">
        <span aria-hidden="true">⌕</span>
        <input id="pesquisa-conteudo" type="search" placeholder="Pesquisar um conteúdo..." autocomplete="off">
      </label>
      <p id="quantidade-conteudos" aria-live="polite"></p>
    </section>

    <section id="lista-conteudos" class="grade-conteudos" aria-live="polite"></section>

    <nav id="paginacao" class="pagination" aria-label="Paginação dos conteúdos"></nav>

    <div id="sem-resultados" class="sem-resultados" hidden>
      <span aria-hidden="true">🔎</span>
      <h3>Nenhum conteúdo encontrado</h3>
      <p>Tente pesquisar usando outra palavra.</p>
    </div>
  </main>

  <footer>
    <p>© 2026 Reforça Libras - Todos os direitos reservados.</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="storage-utils.js"></script>
    <script src="acessos-conta.js?v=20261107-correcao09"></script>
<script src="conteudos-matematica.js"></script>
</body>
</html>
